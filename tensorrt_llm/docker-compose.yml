services:
  tensorrt-llm:
    # Official NVIDIA Triton Server image with TensorRT-LLM Python backend.
    # Check https://catalog.ngc.nvidia.com/orgs/nvidia/containers/tritonserver/tags
    # for newer tags using the pattern: XX.YY-trtllm-python-py3
    image: nvcr.io/nvidia/tritonserver:25.03-trtllm-python-py3
    container_name: model-tensorrt-llm
    ports:
      - "8019:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - tensorrt_llm_models:/root/.cache/huggingface
    networks:
      - app_net
    deploy:
      resources:
        reservations:
          # Recommended: Remove this block if you don't have a GPU
          # Or change 'all' to the number of GPUs you want to use
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Override the default tritonserver entrypoint to use trtllm-serve.
    # trtllm-serve exposes an OpenAI-compatible REST API on the configured port.
    entrypoint: ["trtllm-serve"]
    command: >
      meta-llama/Llama-3.2-1B-Instruct
      --host 0.0.0.0
      --port 8000
      --backend pytorch
      --max_seq_len 4096
      --tp_size 1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    shm_size: '2gb'

networks:
  app_net:
    driver: bridge

volumes:
  tensorrt_llm_models:
